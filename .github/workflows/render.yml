name: Render Bee Extinction Video

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Chrome
        uses: browser-actions/setup-chrome@latest
        with:
          chrome-version: stable

      - name: Build
        run: npm run build

      - name: Render video (optimized)
        run: |
          npx remotion render src/index.ts BeeExtinctionVideo dist/video.mp4 \
            --concurrency=7 \
            --codec=h264 \
            --timeout=90000 \
            --headless=true \
            --gl=angle

      - name: Upload video artifact
        uses: actions/upload-artifact@v4
        with:
          name: bee-extinction-video
          path: dist/video.mp4
          retention-days: 30