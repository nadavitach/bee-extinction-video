name: Render Bee Extinction Video

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build
        run: npm run build

      - name: Render video
        uses: remotion/github-action@v1
        with:
          composition: BeeExtinctionVideo
          output: dist/video.mp4
          codec: h264
          concurrency: 4
          timeout: 180000

      - name: Upload video artifact
        uses: actions/upload-artifact@v4
        with:
          name: bee-extinction-video
          path: dist/video.mp4
          retention-days: 30